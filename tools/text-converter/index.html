<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Texto | ToolHub</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>🔤 Convertidor de Texto</h1>

    <textarea
        id="text"
        placeholder="Escribe o pega aquí tu texto..."
    ></textarea>

    <div class="buttons">

        <button id="uppercase">MAYÚSCULAS</button>

        <button id="lowercase">minúsculas</button>

        <button id="titlecase">Tipo Título</button>

        <button id="alternate">aLtErNaR</button>

        <button id="reverse">Invertir</button>

        <button id="spaces">Quitar espacios</button>

        <button id="lines">Quitar saltos</button>

        <button id="copy">📋 Copiar</button>

    </div>

    <div class="stats">

        <div class="card">
            <h2 id="characters">0</h2>
            <p>Caracteres</p>
        </div>

        <div class="card">
            <h2 id="words">0</h2>
            <p>Palabras</p>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
