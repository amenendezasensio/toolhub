<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Texto | ToolHub</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>🔤 Convertidor de Texto</h1>

    <textarea id="input" placeholder="Escribe o pega tu texto..."></textarea>

    <div class="buttons">
        <button id="upper">MAYÚSCULAS</button>
        <button id="lower">minúsculas</button>
        <button id="capitalize">Primera Letra</button>
    </div>

    <textarea id="output" readonly placeholder="Aquí aparecerá el resultado..."></textarea>

</div>

<script src="script.js"></script>

</body>
</html>
