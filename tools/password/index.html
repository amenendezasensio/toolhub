<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas | ToolHub</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>🔐 Generador de Contraseñas</h1>

    <div class="passwordBox">
        <input type="text" id="password" readonly>
        <button id="copy" type="button">📋</button>
    </div>

    <div class="lengthSection">
        <label for="length">
            Longitud:
            <span id="lengthValue">16</span>
        </label>

        <input
            type="range"
            id="length"
            min="4"
            max="64"
            value="16"
        >
    </div>

    <div class="options">

        <label>
            <input type="checkbox" id="uppercase" checked>
            Mayúsculas
        </label>

        <label>
            <input type="checkbox" id="lowercase" checked>
            Minúsculas
        </label>

        <label>
            <input type="checkbox" id="numbers" checked>
            Números
        </label>

        <label>
            <input type="checkbox" id="symbols" checked>
            Símbolos
        </label>

        <label>
            <input type="checkbox" id="exclude">
            Excluir caracteres confusos
        </label>

    </div>

    <div class="strength">
        <div id="strengthBar"></div>
    </div>

    <p id="strengthText">Seguridad: Alta</p>

    <button id="generate" type="button">
        Generar contraseña
    </button>

    <h2>Últimas contraseñas</h2>

    <ul id="history"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
