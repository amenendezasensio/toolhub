<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Porcentajes | ToolHub</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>📊 Calculadora de Porcentajes</h1>

    <label for="mode">¿Qué quieres calcular?</label>

    <select id="mode">
        <option value="percentOf">¿Cuánto es X% de Y?</option>
        <option value="whatPercent">¿Qué porcentaje representa X de Y?</option>
        <option value="increase">Aumentar un número un X%</option>
        <option value="decrease">Reducir un número un X%</option>
        <option value="change">Cambio porcentual entre dos valores</option>
    </select>

    <div id="inputs">

        <input
            type="number"
            id="value1"
            placeholder="Primer valor"
        >

        <input
            type="number"
            id="value2"
            placeholder="Segundo valor"
        >

    </div>

    <div class="result">
        <h2 id="result">—</h2>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
