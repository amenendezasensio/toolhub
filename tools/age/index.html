<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad | ToolHub</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>🎂 Calculadora de Edad</h1>

    <label for="birthdate">Fecha de nacimiento</label>

    <input
        type="date"
        id="birthdate"
    >

    

    <div class="results">

        <div class="card">
            <h2 id="age">-</h2>
            <p>Edad exacta</p>
        </div>

        <div class="card">
            <h2 id="days">-</h2>
            <p>Días vividos</p>
        </div>

        <div class="card">
            <h2 id="nextBirthday">-</h2>
            <p>Días hasta tu cumpleaños</p>
        </div>

        <div class="card">
            <h2 id="weekday">-</h2>
            <p>Día de nacimiento</p>
        </div>

        <div class="card">
            <h2 id="zodiac">-</h2>
            <p>Signo del zodiaco</p>
        </div>

        <div class="card">
            <h2 id="chinese">-</h2>
            <p>Horóscopo chino</p>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
