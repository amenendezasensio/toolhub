<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Colores | ToolHub</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>🎨 Selector de Colores</h1>

    <input type="color" id="colorPicker" value="#4f46e5">

    <div class="preview" id="preview"></div>

    <div class="values">
        <p><strong>HEX:</strong> <span id="hex"></span></p>
        <p><strong>RGB:</strong> <span id="rgb"></span></p>
        <p><strong>HSL:</strong> <span id="hsl"></span></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
