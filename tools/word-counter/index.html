<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Palabras | ToolHub</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>📝 Contador de Palabras</h1>

    <textarea
        id="text"
        placeholder="Escribe o pega aquí tu texto..."
    ></textarea>

    <div class="stats">

        <div class="card">
            <h2 id="words">0</h2>
            <p>Palabras</p>
        </div>

        <div class="card">
            <h2 id="characters">0</h2>
            <p>Caracteres</p>
        </div>

        <div class="card">
            <h2 id="charactersNoSpaces">0</h2>
            <p>Sin espacios</p>
        </div>

        <div class="card">
            <h2 id="sentences">0</h2>
            <p>Frases</p>
        </div>

        <div class="card">
            <h2 id="paragraphs">0</h2>
            <p>Párrafos</p>
        </div>

        <div class="card">
            <h2 id="readingTime">0 min</h2>
            <p>Lectura</p>
        </div>

    </div>

    <div class="buttons">
        <button id="copy">📋 Copiar</button>
        <button id="clear">🗑️ Limpiar</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
