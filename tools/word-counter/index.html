<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Palabras | ToolHub</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>📝 Contador de Palabras</h1>

        <p class="subtitle">
            Escribe o pega un texto y obtén estadísticas al instante.
        </p>

        <textarea
            id="textInput"
            placeholder="Empieza a escribir aquí..."></textarea>

        <div class="stats">

            <div class="card">
                <h2 id="words">0</h2>
                <p>Palabras</p>
            </div>

            <div class="card">
                <h2 id="characters">0</h2>
                <p>Caracteres</p>
            </div>

            <div class="card">
                <h2 id="readingTime">0 min</h2>
                <p>Tiempo de lectura</p>
            </div>

        </div>

        <div class="buttons">

            <button id="copyButton">📋 Copiar</button>

            <button id="clearButton">🗑️ Limpiar</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
